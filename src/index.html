<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">

  <!-- Primary Meta Tags -->
  <title>NotThisDate - Free Group Scheduling Tool for Finding Dates That Work</title>
  <meta name="description" content="Free reverse availability calendar for group trip planning. Mark when you're NOT available and instantly see the best dates. Alternative to Doodle, Datumprikker, and WhenIsGood. No signup required!">
  <meta name="keywords" content="group scheduling, availability calendar, trip planner, reverse calendar, doodle alternative, datumprikker alternative, whenisgood alternative, group availability, meeting scheduler, event planning tool, find common dates, coordinate schedules, group trip planning, not available, free scheduling tool">
  <meta name="author" content="NotThisDate">
  <meta name="robots" content="index, follow">
  <!-- Default is the landing page; useCanonicalUrl rewrites this per route. -->
  <link rel="canonical" href="https://reverse-date-picker.netlify.app/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://reverse-date-picker.netlify.app/">
  <meta property="og:title" content="NotThisDate - Free Group Scheduling Tool">
  <meta property="og:description" content="Mark when you're NOT available and instantly see the best dates for your group trip, meeting, or event. Free alternative to Doodle and WhenIsGood.">
  <meta property="og:site_name" content="NotThisDate">
  <meta property="og:locale" content="en_US">

  <!-- Twitter. Upgrade to summary_large_image once public/images/og-image.png (1200x630) exists. -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:url" content="https://reverse-date-picker.netlify.app/">
  <meta property="twitter:title" content="NotThisDate - Free Group Scheduling Tool">
  <meta property="twitter:description" content="Mark when you're NOT available and instantly see the best dates for your group. Free alternative to Doodle and WhenIsGood.">

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "NotThisDate",
    "applicationCategory": "BusinessApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "description": "Free reverse availability calendar for coordinating group schedules. Mark when you're NOT available to find the best dates for trips, meetings, and events.",
    "url": "https://reverse-date-picker.netlify.app/",
    "featureList": [
      "Reverse availability scheduling",
      "Group calendar coordination",
      "No signup required for participants",
      "Visual availability heatmap",
      "Email verification for open events",
      "Private and shareable calendars"
    ],
    "browserRequirements": "Requires JavaScript. Requires HTML5.",
    "operatingSystem": "All"
  }
  </script>

  <!-- Matches the 📅 used in the app header logo, rather than the purple logo.svg mark. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter is self-hosted (see public/styles/base.css @font-face) so only Commissioner needs Google Fonts. -->
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
