<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#635bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5248e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#df1b41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4162f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Calendar body -->
  <rect x="10" y="20" width="80" height="70" rx="8" ry="8" fill="url(#calGrad)"/>

  <!-- Calendar top bar -->
  <rect x="10" y="20" width="80" height="18" rx="8" ry="8" fill="#5248e5"/>
  <rect x="10" y="30" width="80" height="8" fill="#5248e5"/>

  <!-- Calendar rings -->
  <rect x="28" y="14" width="6" height="16" rx="3" fill="#fff"/>
  <rect x="66" y="14" width="6" height="16" rx="3" fill="#fff"/>

  <!-- Calendar grid lines -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="10" y1="65" x2="90" y2="65" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="36" y1="38" x2="36" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="63" y1="38" x2="63" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- "NOT" cross mark -->
  <g transform="translate(50, 62)">
    <circle cx="0" cy="0" r="18" fill="url(#crossGrad)" opacity="0.9"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

